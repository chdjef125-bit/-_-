<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>작당모의 | Architectural Studio</title>
    <meta name="description" content="Architecture, Conspired. 우리는 설계를 공모하지 않는다. 모의한다." />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script>
      window.process = { env: { NODE_ENV: 'production' } };
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Pretendard', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
              serif: ['Pretendard', 'ui-serif', 'serif'],
              mono: ['Pretendard', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              jakdang: {
                base: '#000000',    // Pure Black
                panel: '#0a0a0a',   // Almost Black
                border: '#1a1a1a',  // Very Subtle Border
                accent: '#2563eb',  // Cobalt Blue
                text: '#ffffff',    // White text
                muted: '#666666'    // Darker gray text
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'Pretendard', sans-serif;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      * {
        border-radius: 0 !important; 
      }
      
      /* Custom Scrollbar - Minimal */
      ::-webkit-scrollbar {
        width: 0px; /* Hide scrollbar for cleaner look, or make very thin */
        background: transparent;
      }

      /* Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
